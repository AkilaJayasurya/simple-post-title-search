<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post Search</title>
</head>

<body>
  <h1>Search for Posts by Title</h1>
  <input type="text" id="keyword" placeholder="Enter a word">
  <button onclick="searchPosts()">Search</button>

  <h2>Results:</h2>
  <pre id="results"></pre>

  <script>
    // This function gets the posts from the API and shows the ones that match the keyword
    function searchPosts() {
      // Get the word you typed in the input box
      const keyword = document.getElementById('keyword').value;

      //fetch function to get data from the website
      fetch('https://jsonplaceholder.typicode.com/posts')
        .then(response => response.json()) // Convert the response into a readable format
        .then(posts => {
          // Find posts that have the word you typed in their title
          const matchingPosts = posts.filter(post => post.title.toLowerCase().includes(keyword.toLowerCase()));

          // Show the matching posts or tell the user no posts were found
          if (matchingPosts.length > 0) {
            document.getElementById('results').textContent = JSON.stringify(matchingPosts, null, 2);
          } else {
            document.getElementById('results').textContent = 'No posts found!';
          }
        })
        .catch(error => {
          // If something goes wrong, show an error message
          document.getElementById('results').textContent = 'Oops! Something went wrong: ' + error.message;
        });
    }
  </script>
</body>

</html>
